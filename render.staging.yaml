# Isolated pre-production environment. Sync this Blueprint separately from
# render.yaml and never enter production credentials or customer data here.
# Email, customer notifications, Sentry and Daraja credentials remain disabled
# until their later certification items. Cloudinary media is mandatory.
envVarGroups:
  - name: emporium-staging-settings
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: emporium-plug-ke-staging-web.onrender.com
      - key: SITE_BASE_URL
        value: https://emporium-plug-ke-staging-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://emporium-plug-ke-staging-web.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: PRIVACY_CONTROLLER_NAME
        value: "Staging synthetic data only"
      - key: PRIVACY_CONTACT_EMAIL
        value: "staging-invalid@example.invalid"
      - key: PRIVACY_NOTICE_APPROVED
        value: "False"
      - key: REPORT_EMAIL_ENABLED
        value: "False"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: NOTIFICATION_PROVIDER
        value: console
      - key: WHATSAPP_FALLBACK_ENABLED
        value: "False"
      - key: WHATSAPP_ORDER_PHONE
        value: ""
      - key: INBOUND_SMS_ENABLED
        value: "False"
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_CALLBACK_URL
        value: https://emporium-plug-ke-staging-web.onrender.com/payments/mpesa/callback/
      - key: SENTRY_SEND_DEFAULT_PII
        value: "False"
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: ASYNC_HEARTBEAT_MAX_AGE_SECONDS
        value: "600"
      - key: BACKUP_ENABLED
        value: "False"

services:
  - type: web
    name: emporium-plug-ke-staging-web
    runtime: python
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py configure_business_branches
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/ready/
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: emporium-staging-settings
      - key: DATABASE_URL
        fromDatabase:
          name: emporium-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: emporium-staging-keyvalue
          property: connectionString
      # Enter the same secret URL for web, worker and Beat during initial
      # Blueprint creation. Render ignores new sync:false values on later syncs.
      - key: CLOUDINARY_URL
        sync: false

  - type: worker
    name: emporium-plug-ke-staging-worker
    runtime: python
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --check && celery -A config worker --loglevel=INFO --concurrency=2
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: emporium-staging-settings
      - key: DATABASE_URL
        fromDatabase:
          name: emporium-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: emporium-staging-keyvalue
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false

  - type: worker
    name: emporium-plug-ke-staging-beat
    runtime: python
    region: frankfurt
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --check && celery -A config beat --loglevel=INFO --pidfile=
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: emporium-staging-settings
      - key: DATABASE_URL
        fromDatabase:
          name: emporium-staging-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: emporium-staging-keyvalue
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false

  - type: keyvalue
    name: emporium-staging-keyvalue
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: emporium-staging-postgres
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 5
    postgresMajorVersion: "17"
    ipAllowList: []
