{% if messages %}
    {% for message in messages %}
    <div class="pointer-events-auto flex w-full min-w-0 overflow-hidden rounded-xl border-l-4 bg-white shadow-lg ring-1 ring-black ring-opacity-5
        {% if message.tags == 'success' %}border-emerald-500
        {% elif message.tags == 'error' %}border-rose-500
        {% elif message.tags == 'warning' %}border-amber-500
        {% else %}border-blue-500{% endif %} transform transition-all duration-300 translate-x-0"
         role="alert"
         data-auto-dismiss="5000">
        <div class="w-full min-w-0 p-4">
            <div class="flex items-start">
                <div class="min-w-0 flex-1 pt-0.5">
                    <p class="text-sm font-semibold text-gray-900">
                        {% if message.tags == 'success' %}Done
                        {% elif message.tags == 'error' %}Please check this
                        {% elif message.tags == 'warning' %}Please note
                        {% else %}Update{% endif %}
                    </p>
                    <p class="mt-1 break-words text-sm leading-5 text-gray-600">{{ message }}</p>
                </div>
                <div class="ml-4 flex flex-shrink-0">
                    <button type="button" data-dismiss-alert class="inline-flex rounded-md bg-white p-1 text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-600">
                        <span class="sr-only">Close</span>
                        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
{% endif %}
