name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///db.sqlite3
      REDIS_URL: redis://127.0.0.1:6379/1
      SECURE_SSL_REDIRECT: "False"
      MPESA_ENVIRONMENT: sandbox
      MPESA_CONSUMER_KEY: ci-placeholder
      MPESA_CONSUMER_SECRET: ci-placeholder
      MPESA_SHORTCODE: "174379"
      MPESA_PASSKEY: ci-placeholder
      MPESA_CALLBACK_URL: http://testserver/payments/mpesa/callback/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q apps config
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - run: python manage.py collectstatic --noinput
