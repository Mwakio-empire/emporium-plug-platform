name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emporium_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emporium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/emporium_ci
      REDIS_URL: redis://127.0.0.1:6379/1
      SECURE_SSL_REDIRECT: "False"
      MPESA_ENVIRONMENT: sandbox
      MPESA_CONSUMER_KEY: ci-placeholder
      MPESA_CONSUMER_SECRET: ci-placeholder
      MPESA_SHORTCODE: "174379"
      MPESA_PASSKEY: ci-placeholder
      MPESA_CALLBACK_URL: http://testserver/payments/mpesa/callback/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python -m bandit -r apps config -ll -q
      - name: Validate Render Blueprint schemas locally
        run: |
          curl --fail --silent --show-error --location \
            https://render.com/schema/render.yaml.json \
            --output /tmp/render-schema.json
          echo "665539cb0c191856ba38d292b985a963880bb69b030d666e5fe7788e78e7e696  /tmp/render-schema.json" \
            | sha256sum --check --strict
          python scripts/validate_render_blueprints.py \
            --schema /tmp/render-schema.json render.staging.yaml render.yaml
      - run: python -m compileall -q apps config
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - run: python manage.py collectstatic --noinput
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
